<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Jardín Escuela e Instituto Jesús Nazareno{% endblock %}
    </title>
    <!-- FontAwesome para iconos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Estilos personalizados -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <!-- NAVEGACIÓN -->
    <header class="main-header">
      <div class="container nav-container">
        <a href="{{ url_for('inicio') }}" class="logo">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>Jesús Nazareno</span>
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
          <i class="fa-solid fa-bars"></i>
        </button>
        <nav class="nav-menu" id="navMenu">
          <a
            href="{{ url_for('inicio') }}"
            class="{% if request.endpoint == 'inicio' %}active{% endif %}"
            ><i class="fa-solid fa-house"></i> Inicio</a
          >
          <a
            href="{{ url_for('quienes') }}"
            class="{% if request.endpoint == 'quienes' %}active{% endif %}"
            ><i class="fa-solid fa-users"></i> Quiénes Somos</a
          >
          <a
            href="{{ url_for('servicios') }}"
            class="{% if request.endpoint == 'servicios' %}active{% endif %}"
            ><i class="fa-solid fa-book-open"></i> Servicios</a
          >
          <a
            href="{{ url_for('acerca') }}"
            class="{% if request.endpoint == 'acerca' %}active{% endif %}"
            ><i class="fa-solid fa-circle-info"></i> Acerca</a
          >
          <a
            href="{{ url_for('mensajes') }}"
            class="{% if request.endpoint == 'mensajes' %}active{% endif %}"
            ><i class="fa-solid fa-bullhorn"></i> Mensajes</a
          >
          <a
            href="{{ url_for('contacto') }}"
            class="{% if request.endpoint == 'contacto' %}active{% endif %}"
            ><i class="fa-solid fa-address-book"></i> Contacto</a
          >
        </nav>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container main-content">
      {% block content %}{% endblock %}
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="main-footer">
      <div class="container footer-content">
        <p>
          &copy; 2026 Jardín Escuela e Instituto Jesús Nazareno. San Pedro Sula,
          Honduras.
        </p>
        <p class="footer-sub">
          Formando con valores, disciplina y excelencia académica.
        </p>
      </div>
    </footer>

    <!-- Script principal -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
